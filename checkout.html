
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BookNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">📚 BookNest</a>
        <a href="books.html" class="nav-link">Back to Books</a>
    </div>
</nav>

<section class="page-banner">
    <h1>Checkout</h1>
    <p>Complete your demo order.</p>
</section>

<section class="container content-section">
    <div class="form-box">
        <h3>Your Order</h3>
        <p>Total: ₹<span id="checkout-total">0</span></p>
        <hr>

        <form id="checkout-form">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" required>

            <label class="form-label">Email</label>
            <input type="email" class="form-control" required>

            <label class="form-label">Delivery Address</label>
            <textarea class="form-control" rows="3" required></textarea>

            <label class="form-label">Payment Method</label>
            <select class="form-select" required>
                <option value="">Choose payment method</option>
                <option>Cash on Delivery (Demo)</option>
                <option>Pay Later (Demo)</option>
            </select>

            <button type="submit" class="btn main-btn">Place Demo Order</button>
        </form>

        <p id="checkout-message" class="mt-3"></p>
    </div>
</section>

<footer><p>© 2026 BookNest | Made with ❤️ for book lovers</p></footer>
<script src="script.js"></script>
</body>
</html>

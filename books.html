<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - BookNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">📚 BookNest</a>
        <div class="navbar-nav ms-auto flex-row flex-wrap">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="books.html">Books</a>
            <a class="nav-link" href="cart.html">Cart 🛒 (<span id="cart-count">0</span>)</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<section class="page-banner">
    <p class="small-heading">OUR COLLECTION</p>
    <h1>Explore Books</h1>
    <p>Find a book that matches your mood.</p>
</section>

<section class="container content-section">

    <input type="text" id="search" class="form-control"
        placeholder="Search books by name or author...">

    <div class="mb-4 d-flex flex-wrap gap-2">
        <button class="btn card-btn" onclick="filterBooks('All')">All</button>
        <button class="btn card-btn" onclick="filterBooks('Fiction')">Fiction</button>
        <button class="btn card-btn" onclick="filterBooks('Self-help')">Self-help</button>
        <button class="btn card-btn" onclick="filterBooks('Education')">Education</button>
    </div>

    <div class="row g-4" id="book-list"></div>
    <p id="no-results" class="text-center mt-4" style="display:none;">
        No books found. Try another search.
    </p>
</section>

<footer><p>© 2026 BookNest | Made with ❤️ for book lovers</p></footer>

<script src="script.js"></script>
</body>
</html>

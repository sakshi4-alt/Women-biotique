
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - BookNest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">📚 BookNest</a>
        <div>
            <a class="nav-link d-inline-block" href="index.html">Home</a>
            <a class="nav-link d-inline-block" href="books.html">Books</a>
            <a class="nav-link d-inline-block" href="cart.html">Cart</a>
            <a class="nav-link d-inline-block" href="about.html">About</a>
        </div>
    </div>
</nav>

<section class="page-banner">
    <h1>Contact Us</h1>
    <p>We would love to hear from you.</p>
</section>

<section class="container content-section">
    <div class="form-box">
        <form id="contact-form">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" required>

            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" required>

            <label class="form-label">Subject</label>
            <input type="text" class="form-control" required>

            <label class="form-label">Your Message</label>
            <textarea class="form-control" rows="4" required></textarea>

            <button type="submit" class="btn main-btn">Send Message</button>
        </form>
        <p id="contact-message" class="mt-3"></p>
    </div>
</section>

<footer><p>© 2026 BookNest | Made with ❤️ for book lovers</p></footer>
<script src="script.js"></script>
</body>
</html>
